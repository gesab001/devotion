<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Player</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <video id="player" controls autoplay crossorigin="anonymous">
    <track id="subtitles" kind="subtitles" srclang="en" label="English" default>
  </video>

  <script>
    const params = new URLSearchParams(window.location.search);
    const player = document.getElementById("player");
    const track = document.getElementById("subtitles");

	folder = params.get("folder");
	localVideoSource = folder + "/" + params.get("video");
	internetVideoSource = "https://gesab001.github.io/videos/"+ localVideoSource;
	const sources = [  { src: internetVideoSource, type: 'video/mp4' },
	  { src: localVideoSource, type: 'video/mp4'}
	];

	sources.forEach(item => {
	  const source = document.createElement('source');
	  source.src = item.src;
	  source.type = item.type;
	  player.appendChild(source);
	});

	const sources_track = [  { src: internetVideoSource, type: 'video/mp4' },
	  { src: localVideoSource, type: 'video/mp4'}
	];
	// Tell the video element to evaluate the new sources

    //player.src = folder + "/" + params.get("video");
    track.src = folder + "/" + params.get("vtt");
	player.poster = folder + "/" + params.get("video").replace("mp4", "png");
	player.load();	
	
	  // Check if already completed on page load
	  if (localStorage.getItem(folder+"_"+params.get("video")+"_finished") === 'true') {
		console.log('User already finished this video.');
	  }else{
	    console.log("User hasn't watched this video");
	  }
	  // Update localStorage when the video finishes
	  player.addEventListener('ended', () => {
		localStorage.setItem(folder+"_"+params.get("video")+"_finished", 'true');
		console.log('Video finished! Progress saved.');
	  });
	
  </script>
</body>
</html>
