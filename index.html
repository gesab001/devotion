<script>
    let timeLeft = 900; // 15 minutes fix Total time in seconds
    let timerId = null; 
    const display = document.getElementById('display');

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      // Add leading zeros so 5 seconds shows as 05
      display.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
      // Prevent multiple intervals from running at the same time
      if (timerId !== null) return; 

      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          alert("Time's up!");
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = 900;
      updateDisplay();
    }
	
	const buttonsWithoutId = document.querySelectorAll('button:not([id])');

buttonsWithoutId.forEach(button => {
  button.addEventListener('click', () => {
    button.classList.toggle('clicked');
  });
});
  </script>
